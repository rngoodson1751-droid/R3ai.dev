<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#05070d">
<title>Lake Charles Transit Cards</title>
<meta name="description" content="Robert Goodson and Bethany Doty, Lake Charles Transit">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;600;800&display=swap" rel="stylesheet">
<style>


  :root { --gold: #c9a54a; --gold2: #e8c869; --ink: #15130f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05070d; color: #e9e4d8; font-family: 'Jost', system-ui, sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
  body { background: radial-gradient(ellipse at 50% 30%, #15203a 0%, #070a14 55%, #03040a 100%); }

  /* stars */
  .stars { position: fixed; inset: 0; pointer-events: none; }
  .stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: .6; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .15; } }

  /* the card */
  .scene { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(12px, 4vh, 28px); padding: 24px 16px; z-index: 4; }
  .drop { container-type: inline-size; width: min(560px, 92vw, 105vh); aspect-ratio: 1.75 / 1; perspective: 1600px; animation: rise 1.2s cubic-bezier(.2,.9,.25,1.1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(40px) rotateX(30deg) scale(.9); } to { opacity: 1; transform: none; } }
  .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.2,.8,.2,1); cursor: pointer; border: 0; padding: 0; background: none; font: inherit; color: inherit; touch-action: pan-y; }
  .card.live { transition: transform .12s ease-out; }
  .face { position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
  .front { background: linear-gradient(145deg, #f4efe2 0%, #ece5d3 55%, #e3dac4 100%); color: var(--ink); box-shadow: 0 40px 70px -28px rgba(0,0,0,.8), 0 0 0 1px rgba(201,165,74,.55), inset 0 0 0 8px #f1ebdc, inset 0 0 0 9px rgba(176,140,60,.45); }
  .grain { position: absolute; inset: 0; opacity: .4; background-image: repeating-linear-gradient(90deg, rgba(120,100,60,.05) 0 1px, transparent 1px 3px), repeating-linear-gradient(0deg, rgba(120,100,60,.04) 0 1px, transparent 1px 4px); }
  .sheen { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.6) 48%, transparent 60%); background-size: 220% 100%; mix-blend-mode: soft-light; animation: sheen 5.5s ease-in-out infinite; }
  @keyframes sheen { 0% { background-position: -160% 0; } 60%, 100% { background-position: 260% 0; } }
  .glare { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at var(--gx, 50%) var(--gy, 30%), rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 45%); }
  .content { position: absolute; inset: 0; padding: 7% 8%; display: flex; flex-direction: column; justify-content: space-between; }
  .top, .bot { display: flex; justify-content: space-between; gap: 12px; font-family: 'Cormorant SC', serif; letter-spacing: .18em; color: #3b3427; font-size: 2.5cqw; }
  .bot { align-items: flex-end; letter-spacing: .14em; }
  .bot div { display: flex; flex-direction: column; gap: 2px; }
  .mid { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .name { font-family: 'Cormorant SC', serif; font-weight: 500; font-size: 8.6cqw; letter-spacing: .13em; color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,.9), 0 -1px 0 rgba(0,0,0,.18); }
  .rule { width: 26%; height: 1px; background: linear-gradient(90deg, transparent, #b08c3c, transparent); }
  .title { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 3.8cqw; color: #3b3427; }
  .mail { font-family: 'Cormorant Garamond', serif; letter-spacing: .04em; font-size: 2.9cqw; text-transform: none; }
  .back { transform: rotateY(180deg); background: linear-gradient(150deg, #142447 0%, #0d1a36 60%, #091228 100%); box-shadow: 0 40px 70px -28px rgba(0,0,0,.8), 0 0 0 1px rgba(232,200,105,.6); }
  .stripe { position: absolute; left: -10%; right: -10%; top: 78%; height: 5%; background: #f2c230; transform: rotate(-7deg); }
  .stripe.thin { top: calc(78% + 8%); height: 1.6%; opacity: .85; }
  .backin { position: absolute; inset: 0 0 26% 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6cqw; }
  .backin svg { width: 18%; height: auto; }
  .lct { font-family: 'Cormorant SC', serif; font-size: 5.4cqw; letter-spacing: .3em; color: #f1e6c6; }
  .motto { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 3cqw; color: #c9b88a; }

    .go   @keyframes fadein { to { opacity: 1; } }
  .verdict { font-family: 'Cormorant SC', serif; font-size: clamp(13px, 3.6vw, 17px); letter-spacing: .3em; color: var(--gold); text-align: center; }
  .hint { font-size: 13px; letter-spacing: .1em; color: #9aa3b8; }
  
  @media (prefers-reduced-motion: reduce) {
    .go .jet, .go .banner, .go .boom { animation: none; display: none; }
    .drop { container-type: inline-size; width: min(560px, 92vw, 105vh); aspect-ratio: 1.75 / 1; perspective: 1600px; animation: rise 1.2s cubic-bezier(.2,.9,.25,1.1) both; }
            .go     .sheen, .stars i, .burn, .banner .flag { animation: none; }
  }


  .scene { min-height: 100dvh; justify-content: flex-start; padding: max(20px, env(safe-area-inset-top)) 16px 48px; gap: 18px; }
  .pick { position: absolute; opacity: 0; pointer-events: none; }
  .choose { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; width: min(420px, 92vw); padding: 4px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); position: sticky; top: max(12px, env(safe-area-inset-top)); z-index: 10; }
  .choose label { display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 999px; font: 600 14px/1 'Jost', sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #c7cbd6; cursor: pointer; transition: background .25s, color .25s; }
  #v-robert:checked ~ .choose label[for=v-robert], #v-bethany:checked ~ .choose label[for=v-bethany], #v-both:checked ~ .choose label[for=v-both] { background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #0b0f1a; }
  #v-robert:focus-visible ~ .choose label[for=v-robert], #v-bethany:focus-visible ~ .choose label[for=v-bethany], #v-both:focus-visible ~ .choose label[for=v-both] { outline: 2px solid var(--gold2); outline-offset: 2px; }
  #v-robert:checked ~ .people .who-bethany, #v-bethany:checked ~ .people .who-robert { display: none; }
  .people { display: flex; flex-wrap: wrap; justify-content: center; gap: 48px 40px; width: 100%; }
  .person { display: flex; flex-direction: column; align-items: center; gap: 16px; width: min(560px, 92vw); animation: rise .7s cubic-bezier(.2,.9,.25,1.1) both; }
  .person .drop { width: 100%; animation: none; }
  .right { text-align: right; align-items: flex-end; text-transform: none; letter-spacing: .04em; font-family: 'Cormorant Garamond', serif; font-size: 2.7cqw; }
  .right .mail { font-size: 2.9cqw; }
  .addr { font-family: 'Cormorant Garamond', serif; font-size: 2.6cqw; letter-spacing: .06em; color: #9fa9c2; }
  .actions { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px; width: 100%; }
  .act { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 64px; border-radius: 16px; text-decoration: none; font: 600 13px/1 'Jost', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #e9e4d8; background: rgba(255,255,255,.06); border: 1px solid rgba(232,200,105,.28); cursor: pointer; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: background .2s, transform .2s; }
  .act:hover, .act:focus-visible { background: rgba(232,200,105,.14); }
  .act:active { transform: scale(.97); }
  .act.primary { color: #0b0f1a; background: linear-gradient(180deg, var(--gold2), var(--gold)); border-color: transparent; }
  .act svg { width: 22px; height: 22px; }
  .qrwrap { display: flex; align-items: center; gap: 16px; width: 100%; padding: 14px; border-radius: 18px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); }
  .qrwrap svg { width: 96px; height: 96px; border-radius: 8px; flex: none; }
  .qrtext { display: flex; flex-direction: column; gap: 4px; }
  .qrtext b { font-family: 'Cormorant SC', serif; font-weight: 500; font-size: 18px; letter-spacing: .14em; color: var(--gold2); }
  .qrtext span { font-size: 13px; color: #9aa3b8; line-height: 1.4; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; padding: 12px 18px; border-radius: 999px; background: #e8c869; color: #0b0f1a; font: 600 14px 'Jost', sans-serif; transition: .3s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .person { animation: none; } }
  @media (prefers-reduced-transparency: reduce) { .choose, .act { -webkit-backdrop-filter: none; backdrop-filter: none; background: #141b2c; } }

</style>
</head>

<div class="toast" id="toast" role="status"></div>
<script>
(function () {
  var stars = document.getElementById('stars');
  for (var i = 0; i < 90; i++) { var s = document.createElement('i'); s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%'; s.style.animationDelay = (Math.random()*3).toFixed(2)+'s'; stars.appendChild(s); }

  // which card: ?c=robert, ?c=bethany, or both (the default)
  var want = new URLSearchParams(location.search).get('c');
  var pick = document.getElementById('v-' + want);
  if (pick) pick.checked = true;
  document.querySelectorAll('.pick').forEach(function (r) {
    r.addEventListener('change', function () {
      var u = new URL(location.href);
      if (r.value === 'both') u.searchParams.delete('c'); else u.searchParams.set('c', r.value);
      try { history.replaceState(null, '', u); } catch (_) {}
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  var toast = document.getElementById('toast'), tt;
  function say(t) { toast.textContent = t; toast.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { toast.classList.remove('show'); }, 2200); }
  document.querySelectorAll('.share').forEach(function (b) {
    b.addEventListener('click', function () {
      var data = { title: b.dataset.name, text: b.dataset.name + ', ' + b.dataset.title, url: b.dataset.url };
      if (navigator.share) navigator.share(data).catch(function () {});
      else if (navigator.clipboard) navigator.clipboard.writeText(data.url).then(function () { say('Link copied'); });
    });
  });

  document.querySelectorAll('.card').forEach(function (card) {
    var flipped = false, rx = 0, ry = 0, moved = false, sx = 0, sy = 0;
    function paint() { card.style.transform = 'rotateX('+rx+'deg) rotateY('+((flipped?180:0)+ry)+'deg)'; }
    function tilt(e) { var r = card.getBoundingClientRect(); var x = Math.min(1, Math.max(0, (e.clientX-r.left)/r.width)), y = Math.min(1, Math.max(0, (e.clientY-r.top)/r.height)); ry = (x-.5)*32*(flipped?-1:1); rx = (.5-y)*24; card.style.setProperty('--gx', Math.round(x*100)+'%'); card.style.setProperty('--gy', Math.round(y*100)+'%'); paint(); }
    card.addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; moved = false; card.classList.add('live'); });
    card.addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse' || e.buttons) { if (Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy) > 8) moved = true; card.classList.add('live'); tilt(e); } });
    function settle() { card.classList.remove('live'); rx = 0; ry = 0; paint(); }
    card.addEventListener('pointerleave', settle); card.addEventListener('pointercancel', settle);
    card.addEventListener('pointerup', function (e) { if (e.pointerType !== 'mouse') settle(); });
    card.addEventListener('click', function () { if (moved) { moved = false; return; } flipped = !flipped; settle(); });
  });
})();
