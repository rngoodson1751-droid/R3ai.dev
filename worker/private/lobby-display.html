<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#0d1526"/>
<title>LC Transit Bus Tracker</title>
<link rel="icon" href="/favicon.svg"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* Screens wider than 1080p (a 4K lobby TV) keep the same proportions. --ts is the rider's text size choice. */
html{font-size:calc(clamp(16px,.8333vw,36px)*var(--ts,1))}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0f1e;color:#fff;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #7ec8f5;outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0d1526;padding:10px max(20px,env(safe-area-inset-right)) 10px max(20px,env(safe-area-inset-left));border-bottom:2px solid #1e3a6e;flex-shrink:0;z-index:1000}
.brand{display:flex;align-items:center;gap:.75rem;min-width:0}
/* The City logo sits on a white disc so it reads on the dark header. Its height follows the title and clock. */
.logo{height:2.75rem;width:2.75rem;flex-shrink:0;border-radius:50%;background:#fff;padding:.14rem;display:block}
header h1{font-size:1.4rem;letter-spacing:2px;color:#7ec8f5;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:.62rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:.2rem .55rem;border-radius:99px;border:1px solid;white-space:nowrap;flex-shrink:0}
.pill.live{color:#7be36a;border-color:#2f7d2a}.pill.live::before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:50%;background:#7be36a;margin-right:.45em;animation:pulse 2s infinite}
.pill.sim{color:#f7c224;border-color:#8a6d12}.pill.sched{color:#9fb6d6;border-color:#3a5a7a}
@keyframes pulse{50%{opacity:.25}}
/* A bus off its route: the same pill as "Live", in red with a filled background, centred in the header on wide screens. */
header{position:relative}
.pill.detour{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:34vw;overflow:hidden;text-overflow:ellipsis;color:#ffd0d0;border-color:#ff4d4d;background:rgba(214,40,40,.34);font-weight:800;font-size:.72rem;padding:.32rem .85rem}
.pill.detour::before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:50%;background:#ff4d4d;margin-right:.5em;animation:pulse 1.2s infinite}
.bang{display:none}
.tk-d{color:#ff6b6b;font-weight:800}
/* Phones and tablets have no room in the header, so the route's card gets a red exclamation mark instead. */
@media (max-width:1100px),(max-height:520px){
  .pill.detour{display:none!important}
  .route-card.detour{position:relative;padding-left:1.7rem}
  .route-card.detour .bang{display:block;position:absolute;left:.5rem;top:50%;transform:translateY(-50%);color:#ff4d4d;font-weight:900;font-size:1.9rem;line-height:1}
}
.head-right{display:flex;align-items:center;gap:1rem;flex-shrink:0}
.wx{font-size:.95rem;color:#cfe3f7;white-space:nowrap}.wx b{font-size:1.15rem;color:#fff}
#clock{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tools{display:flex;gap:.4rem}
.tools button{background:#111c35;border:1px solid #1e3a6e;border-radius:8px;min-width:2.75rem;height:2.75rem;padding:0 .6rem;font-weight:700;font-size:.9rem}
.tools button:hover{background:#17274a}
.alert{display:flex;align-items:flex-start;gap:.7rem;background:#5a3d00;border-bottom:2px solid #f7c224;color:#fff;padding:.55rem max(20px,env(safe-area-inset-right)) .55rem max(20px,env(safe-area-inset-left));flex-shrink:0;z-index:1000;font-size:.95rem;line-height:1.35;text-align:left;border-left:0;border-right:0;border-top:0;width:100%}
.alert.severe{background:#6d1010;border-color:#ff6b6b}
.alert .ic{font-size:1.2rem;line-height:1.2}
.alert .tx{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.alert.open .tx{display:block}
.alert .n{font-size:.75rem;color:#ffe9a8;white-space:nowrap;padding-top:.15rem}
.main{display:flex;flex:1;overflow:hidden;min-height:0}
#map{flex:1;min-width:0;background:#dfe7ea}
/* Plan in Google Maps: a see-through button hanging just under the header, centred on the map */
.plan{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:800;display:inline-flex;align-items:center;gap:.45em;padding:.5rem 1rem;min-height:2.5rem;border-radius:99px;border:1px solid rgba(126,200,245,.75);background:rgba(13,21,38,.5);-webkit-backdrop-filter:blur(8px) saturate(1.3);backdrop-filter:blur(8px) saturate(1.3);color:#fff;font:700 .82rem/1 inherit;font-family:inherit;letter-spacing:.3px;text-decoration:none;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.28);cursor:pointer}
.plan:hover,.plan:focus-visible{background:rgba(13,21,38,.72);border-color:#7ec8f5}
.plan:focus-visible{outline:3px solid #7ec8f5;outline-offset:2px}
.plan svg{width:1.05em;height:1.05em;flex-shrink:0}
#map a.plan,#map a.plan:hover{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55)} /* the map library colours every link on it blue */
body.lobbymode .plan{display:none}
/* phones and tablets only: gone on a wide screen worked with a mouse (the same 1100px line the detour notice uses) */
@media (min-width:1101px) and (min-height:521px) and (hover:hover) and (pointer:fine){.plan{display:none}}
.sidebar{width:19.375rem;flex-shrink:0;background:#0d1526;border-left:2px solid #1e3a6e;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:10px;z-index:1000}
.sidebar-title{font-size:.7rem;letter-spacing:3px;text-transform:uppercase;color:#7f9dbd;text-align:center;padding-bottom:8px;border-bottom:1px solid #1e3a6e}
#cards{display:grid;gap:10px}
.route-card{display:block;width:100%;text-align:left;background:#111c35;border-radius:10px;overflow:hidden;border:1px solid #1e3a6e}
.route-card[aria-pressed=true]{border-color:#7ec8f5;box-shadow:0 0 0 2px #7ec8f5 inset}
.route-card.faded{opacity:.45}
.route-header{display:flex;align-items:center;gap:10px;padding:9px 12px}
.route-badge{width:2.25rem;height:2.25rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1rem;flex-shrink:0;box-shadow:0 0 10px rgba(0,0,0,.5)}
.route-info{min-width:0;flex:1}
.route-info h2{font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl{font-size:.72rem;color:#7ec8f5;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl.ok{color:#7be36a}.sl.late{color:#f7c224}.sl.vlate{color:#ff8a8a}.sl.early{color:#6fb7ff}.sl.mute{color:#9fb6d6}
.stop-sec{border-top:1px solid #1e3a6e;padding:8px 12px 10px}
.stop-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:2px;color:#7f9dbd;margin-bottom:4px}
.next-sn{font-size:.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eta-row{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.eta-num{font-size:1.8rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.eta-lbl{font-size:.75rem;color:#7ec8f5}
.next-sn small{font-weight:400;color:#9fb6d6;font-size:.8em}
.stop-no{font-size:.75rem;color:#9fb6d6;margin-top:1px}
.sl .sn{display:none;color:#9fb6d6}
.en{color:#ff6b6b}.es{color:#f7c224}.eo{color:#6ecb1a}.ef{color:#4aa8ff}
.eta-num.ok{color:#7be36a}.eta-num.late{color:#f7c224}.eta-num.vlate{color:#ff8a8a}.eta-num.early{color:#6fb7ff}.eta-num.mute{color:#9fb6d6}
.pb-w{margin-top:6px;background:#1e3a6e;border-radius:4px;height:5px;overflow:hidden}
.pb-f{height:100%;border-radius:4px;transition:width 1s linear}
.no-bus{font-size:.82rem;color:#9fb6d6;font-style:italic;padding:4px 0 2px}
.chip{align-self:center;background:#17274a;border:1px solid #7ec8f5;color:#fff;border-radius:99px;padding:.45rem 1rem;font-size:.8rem;font-weight:600}
.sidebar::-webkit-scrollbar{width:4px}.sidebar::-webkit-scrollbar-track{background:#0a0f1e}.sidebar::-webkit-scrollbar-thumb{background:#1e3a6e;border-radius:2px}
/* stops near the rider */
.near{background:#0f2440;border:1px solid #2e9afe;border-radius:10px;padding:8px 10px}
.near h3{font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:#7ec8f5;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.near h3 button{background:none;border:0;font-size:1.1rem;line-height:1;padding:.2rem .4rem;color:#9fb6d6}
.near li{list-style:none}
.near li button{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-top:1px solid #1e3a6e;padding:.5rem 0;text-align:left;font-size:.85rem}
.near li small{color:#9fb6d6;display:block;font-size:.72rem}
.near li span:last-child{white-space:nowrap;font-weight:700}
/* lobby panel: weather, notices and the phone link take turns */
.lobby{margin-top:auto;background:#111c35;border:1px solid #1e3a6e;border-radius:10px;padding:12px;min-height:11.5rem;display:flex;flex-direction:column;justify-content:center}
.lobby h3{font-size:.65rem;letter-spacing:2.5px;text-transform:uppercase;color:#7f9dbd;margin-bottom:6px}
.lobby .big{font-size:2.6rem;font-weight:900;line-height:1}
.lobby p{font-size:.9rem;line-height:1.4;color:#dbe8f6}
.lobby .row{display:flex;gap:12px;align-items:center}
.lobby .qr{width:7rem;height:7rem;background:#fff;border-radius:6px;padding:4px;flex-shrink:0}.lobby .qr svg{display:block;width:100%;height:100%}
.lobby .dots{display:flex;gap:5px;justify-content:center;margin-top:8px}.lobby .dots i{width:6px;height:6px;border-radius:50%;background:#1e3a6e}.lobby .dots i.on{background:#7ec8f5}
.ticker{background:#060c1a;border-top:1px solid #1e3a6e;overflow:hidden;white-space:nowrap;flex-shrink:0;height:1.75rem;line-height:1.75rem;font-size:.75rem;color:#9fb6d6;position:relative;z-index:1000;box-sizing:content-box;padding-bottom:env(safe-area-inset-bottom)}
.ticker-i{display:inline-block;animation:tk 90s linear infinite;padding-left:100%}
@keyframes tk{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.toast{position:fixed;left:50%;bottom:3.2rem;transform:translateX(-50%);background:#111c35;border:1px solid #7ec8f5;border-radius:10px;padding:.6rem 1rem;font-size:.9rem;z-index:2000;max-width:90vw;text-align:center}
/* map pieces */
.leaflet-popup-content-wrapper{background:#111c35;color:#fff;border:1px solid #1e3a6e;border-radius:8px}
.leaflet-popup-tip{background:#111c35}
.leaflet-popup-content{margin:.65rem .75rem;font-size:.875rem;line-height:1.35;min-width:11.5rem}
.leaflet-container a.leaflet-popup-close-button{color:#9fb6d6}
.pp h3{font-size:.95rem;margin-bottom:2px}.pp .sub{color:#9fb6d6;font-size:.75rem;margin-bottom:6px}
.pp ul{list-style:none}.pp li{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid #1e3a6e}
.pp .rb,.near .rb{width:1.4rem;height:1.4rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:.75rem;flex-shrink:0;vertical-align:middle}
.pp .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.82rem}
.pp .tm{font-weight:800;white-space:nowrap}.pp .tg{font-size:.7rem;color:#9fb6d6;white-space:nowrap}.pp .tg.lv{color:#7be36a}.pp .tg.lt{color:#f7c224}
.pp p{font-size:.82rem;margin-top:3px}
.bus{position:relative;width:36px;height:36px;transition:opacity .3s}
.bus b{position:absolute;inset:0;border-radius:50%;background:var(--c);color:var(--t);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font:900 14px Arial,sans-serif;box-shadow:0 1px 6px rgba(0,0,0,.55)}
.bus i{position:absolute;inset:-8px;transform:rotate(var(--h))}
.bus i::before{content:"";position:absolute;left:50%;top:0;margin-left:-6px;border:6px solid transparent;border-top:0;border-bottom:9px solid var(--c);filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff)}
.bus span{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;background:#0d1526;color:#fff;font:700 10px Arial,sans-serif;padding:1px 5px;border-radius:6px;white-space:nowrap;border:1px solid #1e3a6e}
.bus.dim{opacity:.2}
.arw{pointer-events:none}
.me{width:16px;height:16px;border-radius:50%;background:#2e9afe;border:3px solid #fff;box-shadow:0 0 0 2px #2e9afe,0 1px 6px rgba(0,0,0,.5)}
.leaflet-bar a.locate{font-size:18px;font-weight:700}
body.lobbymode .tools{display:none}
[hidden]{display:none!important}
noscript{display:block;padding:1rem;background:#5a3d00}

/* ---------- responsive ---------- */
/* Short wide screens (a laptop): tighten the cards so all five routes show without scrolling. */
@media (min-width:901px) and (max-height:860px) and (min-height:521px){
  .sidebar{gap:8px}
  #cards{gap:8px}
  .route-header{padding:6px 12px}
  .route-badge{width:2rem;height:2rem}
  .stop-sec{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:6px 12px 8px}
  .stop-lbl{display:none} /* no room for the "Next stop" label here; the stop number takes its line */
  .next-sn,.no-bus{grid-column:1;grid-row:1}
  .stop-no{grid-column:1;grid-row:2}
  .eta-row{grid-column:2;grid-row:1/3;flex-direction:column;align-items:center;gap:1px;margin:0;min-width:3.4rem}
  .eta-num{font-size:1.5rem}
  .eta-lbl{font-size:.62rem;text-align:center}
  .pb-w{grid-column:1/-1;grid-row:3}
  .lobby{display:none}
}
/* The lobby screen: the same tighter cards, to leave room for the weather and notices panel. */
@media (min-width:901px) and (min-height:521px){
  .lobbymode .sidebar{gap:8px}
  .lobbymode #cards{gap:8px}
  .lobbymode .route-header{padding:6px 12px}
  .lobbymode .stop-sec{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:6px 12px 8px}
  .lobbymode .stop-lbl{grid-column:1;grid-row:1;margin-bottom:2px}
  .lobbymode .next-sn,.lobbymode .no-bus{grid-column:1;grid-row:2}
  .lobbymode .stop-no{grid-column:1;grid-row:3}
  .lobbymode .eta-row{grid-column:2;grid-row:1/4;flex-direction:column;align-items:center;gap:1px;margin:0;min-width:3.4rem}
  .lobbymode .eta-lbl{font-size:.62rem;text-align:center}
  .lobbymode .pb-w{grid-column:1/-1;grid-row:4}
}
/* Phones and small tablets: each route becomes one compact row. */
@media (max-width:900px),(max-height:520px){
  header{padding-top:6px;padding-bottom:6px;gap:8px}
  header h1{font-size:1.05rem;letter-spacing:1px}
  .brand{gap:.5rem}
  .logo{height:2.2rem;width:2.2rem;padding:.11rem}
  .pill{font-size:.52rem;letter-spacing:.5px;padding:.15rem .4rem}
  .head-right{gap:.5rem}
  .wx{display:none}
  #clock{font-size:1.05rem}
  .tools{gap:.3rem}
  .tools button{min-width:2.4rem;height:2.4rem;padding:0 .3rem;font-size:.8rem}
  .alert{font-size:.82rem;padding-top:.4rem;padding-bottom:.4rem}
  .sidebar{padding:8px;gap:8px;padding-right:max(8px,env(safe-area-inset-right))}
  .sidebar-title,.lobby{display:none}
  #cards{gap:6px}
  .route-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:5px 10px}
  .route-header,.route-info,.stop-sec{display:contents}
  .route-badge{grid-column:1;grid-row:1/4;width:2.1rem;height:2.1rem}
  .route-info h2{grid-column:2;grid-row:1;font-size:.7rem;font-weight:600;color:#9fb6d6}
  .stop-lbl,.stop-no{display:none}
  .sl .sn{display:inline}
  .next-sn,.no-bus{grid-column:2;grid-row:2}
  .no-bus{padding:0}
  .sl{grid-column:2;grid-row:3;margin:0;font-size:.68rem}
  .eta-row{grid-column:3;grid-row:1/4;flex-direction:column;align-items:center;gap:1px;margin:0;width:4.6rem}
  .eta-num{font-size:1.45rem}
  .eta-lbl{font-size:.6rem;text-align:center;line-height:1.15}
  .pb-w{display:none}
}
/* Upright phones and tablets: the map on top, the routes underneath. */
@media (max-width:900px) and (orientation:portrait),(max-width:600px){
  .main{flex-direction:column}
  #map{flex:1 1 auto;min-height:36dvh}
  .sidebar{width:auto;flex:0 1 auto;max-height:52dvh;border-left:0;border-top:2px solid #1e3a6e;padding-left:max(8px,env(safe-area-inset-left))}
  #cards{grid-template-columns:repeat(auto-fit,minmax(16rem,1fr))}
}
/* A phone on its side: keep the two columns, with a narrower list. */
@media (max-height:520px) and (min-width:601px){
  .sidebar{width:min(17rem,42vw)}
}
@media (max-width:600px){.pill{display:none}html.big #clock{display:none}}
@media (prefers-reduced-motion:reduce){
  .ticker-i{animation:none;padding-left:10px}
  .pb-f{transition:none}
  .pill.live::before,.pill.detour::before{animation:none}
}
</style>
</head>

  else if (st && st.kind === 'layover') h += `<p>${t('terminal')}. ${t('departs')} ${clockText(st.at)}</p>`;
  else if (st && st.kind === 'detour') h += `<p>${t('offRoute')}</p>`;
  h += `<p>${v.s > 1 ? t('mph', Math.round(v.s * 2.23694)) : t('stopped')} · ${t('updated', age)}</p>`;
  if (r && (r.wheelchair || r.bikes)) h += `<p>${[r.wheelchair && '&#9855; ' + t('wheel'), r.bikes && '&#128690; ' + t('bike')].filter(Boolean).join('<br>')}</p>`;
  return h + '</div>';
}
function showBus(id) { const b = buses[id]; if (!b) return; openBus = id; openStop = null; b.marker.unbindPopup().bindPopup(busHtml(b.v), { maxWidth: 300, autoPanPaddingTopLeft: [LOBBY ? 16 : 58, 12], autoPanPaddingBottomRight: [12, 12] }).openPopup(); }

// ---------- route cards ----------
const cards = {}; let tickerHtml = '';
for (const r of NET.routes) {
  const el = document.createElement('button');
  el.type = 'button'; el.className = 'route-card'; el.setAttribute('aria-pressed', 'false');
  el.innerHTML = `<div class="route-header"><span class="bang" aria-hidden="true">!</span><div class="route-badge" style="background:${r.color};color:${r.text}">${esc(r.id)}</div><div class="route-info"><h2></h2><div class="sl"></div></div></div><div class="stop-sec"><div class="stop-lbl"></div><div class="next-sn"></div><div class="stop-no"></div><div class="eta-row"><span class="eta-num"></span><span class="eta-lbl"></span></div><div class="pb-w"><div class="pb-f" style="background:${r.color}"></div></div></div>`;
  el.addEventListener('click', () => select(selected === r.id ? null : r.id));
  $('cards').appendChild(el);
  const q = s => el.querySelector(s);
  cards[r.id] = { el, name: q('h2'), sl: q('.sl'), lbl: q('.stop-lbl'), stop: q('.next-sn'), no: q('.stop-no'), row: q('.eta-row'), num: q('.eta-num'), unit: q('.eta-lbl'), bar: q('.pb-w'), fill: q('.pb-f') };
}
function renderCards() {
  const ticks = [], detours = [];
  for (const r of NET.routes) {
    const c = cards[r.id], s = routeStatus(r), simOrLive = DATA && !DATA.error;
    c.name.textContent = routeName(r);
    c.lbl.textContent = t('next');
    c.el.setAttribute('aria-pressed', String(selected === r.id));
    c.el.classList.toggle('faded', !!selected && selected !== r.id);
    const onDetour = s.kind === 'detour' || !!s.detour;
    c.el.classList.toggle('detour', onDetour);
    if (onDetour) detours.push({ r, bus: busNo(s.v.id), stop: s.stop ? NET.stops[s.stop][0] : '' });
    c.el.title = t('showOnly', routeName(r));
    // The big number is how long until the bus is back at the terminal (or leaves it), in the colour of how it is running;
    // the next stop has its own small time.
    let status = '', cls = 'mute', stop = '', near = '', eta = null, unit = '', prog = null, quiet = false;
    const toEnd = x => x.loop ? t('toTerminal') : t('toStop', NET.stops[x.endStop][0]);
    if (s.kind === 'live') { status = t('bus', busNo(s.v.id)) + ' · ' + (s.detour ? t('detour') : delayText(s.delay)); cls = s.detour ? 'vlate' : delayClass(s.delay); stop = NET.stops[s.stop][0]; near = etaText(s.eta); eta = s.end; unit = toEnd(s); prog = s.prog; }
    else if (s.kind === 'layover') { status = t('bus', busNo(s.v.id)) + ' · ' + t('terminal'); cls = s.v.delay >= LATE ? 'late' : 'ok'; stop = t('departs') + ' ' + clockText(s.at); eta = Math.max(0, s.eta); unit = t('toLeave'); prog = 0; }
    else if (s.kind === 'detour') { status = t('bus', busNo(s.v.id)) + ' · ' + t('offRoute'); cls = 'late'; stop = t('offRoute'); quiet = true; }
    else if (s.kind === 'sched') { status = t('sched') + (simOrLive ? ' · ' + t('noLive') : ''); stop = NET.stops[s.stop][0]; near = etaText(s.eta); eta = s.end; unit = toEnd(s); prog = s.prog; }
    else if (s.kind === 'wait') { status = t('sched'); stop = t('nextTrip', clockText(s.at)); quiet = true; }
    else { status = t(s.kind === 'ended' ? 'ended' : 'noService'); stop = status; status = ''; quiet = true; }
    const stopId = s.kind === 'live' || s.kind === 'sched' ? s.stop : s.kind === 'layover' ? r.patterns[0][0][0] : null, noText = stopId ? t('stopNo', stopId) : '';
    c.sl.textContent = status; c.sl.className = 'sl ' + cls;
    if (noText) { const sn = document.createElement('span'); sn.className = 'sn'; sn.textContent = noText + (status ? ' · ' : ''); c.sl.prepend(sn); } // compact cards: the stop number leads this line
    c.no.textContent = noText; c.no.hidden = !noText;
    c.stop.textContent = stop; c.stop.className = quiet ? 'no-bus' : 'next-sn';
    if (near) { const sm = document.createElement('small'); sm.textContent = ' · ' + near; c.stop.appendChild(sm); }
    c.row.hidden = eta == null; c.bar.hidden = prog == null;
    // the number takes the status line's colour: green on time, yellow late, red very late, blue early, grey with no live bus
    if (eta != null) { const now = eta < 45; c.num.textContent = now ? '\u2605' : Math.round(eta / 60); c.num.className = 'eta-num ' + cls; c.unit.textContent = now ? t('now') : unit; }
    if (prog != null) c.fill.style.width = Math.round(Math.min(1, prog) * 100) + '%';
    const spoken = eta != null ? (eta < 45 ? t('now') : Math.round(eta / 60) + ' ' + unit) : '';
    c.el.setAttribute('aria-label', [routeName(r), onDetour ? t('detourNote') : '', status, (s.kind === 'live' || s.kind === 'sched' ? t('next') + ' ' : '') + stop + (noText ? ', ' + noText : '') + (near ? ', ' + near : ''), spoken].filter(Boolean).join(', '));
    ticks.push(t('route', r.id) + ': ' + stop + (near ? ' ' + near : '') + (spoken ? ', ' + spoken : '') + (s.kind === 'live' && !s.detour && (s.delay >= LATE || s.delay <= EARLY) ? ' (' + delayText(s.delay) + ')' : ''));
  }
  const notes = (DATA ? DATA.alerts : []).map(a => said(a, 'title'));
  // detours lead the ticker in bold red, and repeat at the end so one is never far off on a long scroll
  const flags = detours.map(d => `<b class="tk-d">\u26A0 ${esc(t('detourTick', d.r.id, d.bus, d.stop))}</b>`);
  const html = [...flags, ...notes.map(esc), ...ticks.map(esc), ...flags].join('   •   ');
  if (tickerHtml !== html) { tickerHtml = html; $('ticker').innerHTML = html; $('ticker').style.animationDuration = Math.max(45, $('ticker').textContent.length * .42) + 's'; }
  const pill = $('detour');
  pill.hidden = !detours.length;
  pill.textContent = detours.length > 1 ? t('detourHeadMany', detours.map(d => d.r.id).join(', ')) : detours.length ? t('detourHead', detours[0].r.id) : '';
  $('show-all').hidden = !selected;
}

// ---------- header: mode, weather, alerts ----------
let alertAt = 0, alertList = [];
function renderHead() {
  const m = $('mode');
  const kind = !DATA || DATA.error ? 'sched' : DATA.source === 'sim' ? 'sim' : 'live';
  m.hidden = false; m.className = 'pill ' + kind; m.textContent = t(kind === 'sched' ? 'schedOnly' : kind);
  const w = DATA && DATA.weather, wx = $('wx');
  wx.hidden = !w;
  if (w) wx.innerHTML = `<b>${Math.round(w.temp)}&deg;</b> ${lang === 'en' ? esc(w.text) : w.rain ? t('rain', w.rain) : ''}`;
  alertList = [...(w ? w.warnings : []).map(x => ({ severe: true, title: x.event, body: x.headline })), ...(DATA ? DATA.alerts : []).filter(a => a.kind === 'alert' && (!selected || !a.routes.length || a.routes.includes(selected)))];
  showAlert();
}
function showAlert() {
  const el = $('alert');
  el.hidden = !alertList.length;
  if (!alertList.length) return;
  const a = alertList[alertAt % alertList.length];
  el.classList.toggle('severe', !!a.severe);
  const html = `<b>${esc(said(a, 'title')).replace(/([^.!?])$/, '$1.')}</b>${said(a, 'body') && said(a, 'body') !== said(a, 'title') ? ' ' + esc(said(a, 'body')) : ''}`;
  if ($('alert-tx').innerHTML !== html) $('alert-tx').innerHTML = html;
  $('alert-n').textContent = alertList.length > 1 ? t('more', alertAt % alertList.length + 1, alertList.length) : '';
}
$('alert').addEventListener('click', () => $('alert').classList.toggle('open'));
setInterval(() => { if (alertList.length > 1 && !$('alert').classList.contains('open')) { alertAt++; showAlert(); } }, 9000);

// ---------- lobby panel ----------
let slide = 0, qrSvg = '';
function lobbySlides() {
  const out = [], w = DATA && DATA.weather;
  if (w) out.push(`<h3>${t('weather')}</h3><div class="row"><div class="big">${Math.round(w.temp)}&deg;</div><p>${esc(w.text)}${w.rain ? '<br>' + t('rain', w.rain) : ''}</p></div>${w.next[0] ? `<p style="margin-top:8px">${esc(w.next[0].name)}: ${Math.round(w.next[0].temp)}&deg;, ${esc(w.next[0].text)}</p>` : ''}`);
  for (const a of (DATA ? DATA.alerts : []).filter(a => a.kind === 'notice')) out.push(`<h3>${t('notice')}</h3><p><b>${esc(said(a, 'title'))}</b></p><p style="margin-top:4px">${esc(said(a, 'body'))}</p>`);
  if (qrSvg) out.push(`<h3>${t('phone')}</h3><div class="row"><div class="qr">${qrSvg}</div><p>${t('scan')}</p></div>`);
  return out;
}
function renderLobby() {
  if (!LOBBY) return;
  const s = lobbySlides(), el = $('lobby');
  el.hidden = !s.length;
  if (s.length) el.innerHTML = s[slide % s.length] + (s.length > 1 ? `<div class="dots">${s.map((_, i) => `<i class="${i === slide % s.length ? 'on' : ''}"></i>`).join('')}</div>` : '');
}
if (LOBBY) {
  setInterval(() => { slide++; renderLobby(); }, 12000);
  // The code opens this same page, without the lobby setting, on a rider's phone.
  const s = document.createElement('script'); s.src = 'https://unpkg.com/qrcode-generator@1.4.4/qrcode.js';
  s.onload = () => { try { const q = qrcode(0, 'M'); q.addData(location.origin + location.pathname); q.make(); qrSvg = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); renderLobby(); } catch (e) {} };
  document.head.appendChild(s);
}

// ---------- stops near me ----------
let me = null, meMark = null, toastTimer = 0;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 5000); }
const far = (a, b) => { const k = Math.PI / 180, x = (b[1] - a[1]) * k * Math.cos(a[0] * k), y = (b[0] - a[0]) * k; return Math.hypot(x, y) * 6371000; };
function renderNear() {
  const el = $('near');
  el.hidden = !me;
  if (!me) return;
  const list = Object.keys(stopMarks).map(id => ({ id, m: far(me, NET.stops[id].slice(1)) })).sort((a, b) => a.m - b.m).slice(0, 3);
  el.innerHTML = `<h3><span>${t('nearYou')}</span><button type="button" id="near-x" aria-label="${t('close')}">&times;</button></h3><ul>` + list.map(s => {
    const a = arrivals(s.id, 1)[0], ft = s.m * 3.28084;
    return `<li><button type="button" data-stop="${esc(s.id)}"><span>${esc(NET.stops[s.id][0])}<small>${t('stopNo', esc(s.id))} · ${ft < 1000 ? t('ft', Math.round(ft / 10) * 10) : t('mi', (s.m / 1609.344).toFixed(1))}${a ? ' · ' + badge(a.r) : ''}</small></span><span>${a ? etaText(a.sec) : ''}</span></button></li>`;
  }).join('') + '</ul>';
  $('near-x').onclick = () => { me = null; if (meMark) { map.removeLayer(meMark); meMark = null; } renderNear(); };
  el.querySelectorAll('[data-stop]').forEach(b => b.onclick = () => { const id = b.dataset.stop; map.setView(NET.stops[id].slice(1), Math.max(map.getZoom(), 16)); showStop(id); });
}
function locate() {
  if (!navigator.geolocation) return toast(t('locOff'));
  toast(t('locating'));
  navigator.geolocation.getCurrentPosition(pos => {
    $('toast').hidden = true;
    me = [pos.coords.latitude, pos.coords.longitude];
    if (!routeBounds.pad(.5).contains(me)) { me = null; return toast(t('locFar')); }
    if (meMark) map.removeLayer(meMark);
    meMark = L.marker(me, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }), keyboard: false, title: t('here') }).addTo(map);
    const nearest = Object.keys(stopMarks).map(id => NET.stops[id].slice(1)).sort((a, b) => far(me, a) - far(me, b)).slice(0, 3);
    map.fitBounds(L.latLngBounds([me, ...nearest]).pad(.3), { maxZoom: 17 });
    renderNear();
    $('sidebar').scrollTop = 0;
  }, () => toast(t('locOff')), { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
}
let locateLink = null;
if (!LOBBY) {
  const Locate = L.Control.extend({ options: { position: 'topleft' }, onAdd() { const box = L.DomUtil.create('div', 'leaflet-bar'); locateLink = L.DomUtil.create('a', 'locate', box); locateLink.href = '#'; locateLink.innerHTML = '&#9678;'; locateLink.setAttribute('role', 'button'); L.DomEvent.on(locateLink, 'click', e => { L.DomEvent.stop(e); locate(); }); return box; } });
  map.addControl(new Locate());
}

// ---------- text size and language ----------
const SIZES = [1, 1.2, 1.4];
let size = Math.max(0, SIZES.indexOf(+store.get('lct-size')));
function applySize() { document.documentElement.style.setProperty('--ts', SIZES[size]); document.documentElement.classList.toggle('big', size > 0); mapResized(); }
$('btn-text').addEventListener('click', () => { size = (size + 1) % SIZES.length; store.set('lct-size', SIZES[size]); applySize(); });
$('btn-lang').addEventListener('click', () => { lang = lang === 'en' ? 'es' : 'en'; store.set('lct-lang', lang); render(); });
$('show-all').addEventListener('click', () => select(null));
function renderWords() {
  document.documentElement.lang = lang;
  $('side-title').textContent = t('all');
  $('show-all').textContent = t('showAll');
  $('btn-lang').textContent = lang === 'en' ? 'ES' : 'EN'; $('btn-lang').setAttribute('aria-label', t('toLangLabel')); $('btn-lang').title = t('toLang');
  $('btn-text').setAttribute('aria-label', t('textSize')); $('btn-text').title = t('textSize');
  $('map').setAttribute('aria-label', t('mapLabel'));
  planBtn.lastChild.textContent = t('plan'); planBtn.setAttribute('aria-label', t('planLabel'));
  $('sidebar').setAttribute('aria-label', t('all'));
  if (locateLink) { locateLink.title = t('locate'); locateLink.setAttribute('aria-label', t('locate')); }
}

function render() {
  renderWords(); renderHead(); renderCards(); placeBuses(); renderNear(); renderLobby();
  if (openStop && map._popup) map._popup.setContent(stopHtml(openStop));
  if (openBus && buses[openBus] && buses[openBus].marker.getPopup()) buses[openBus].marker.getPopup().setContent(busHtml(buses[openBus].v));
}
const clockFmt = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit', second: '2-digit' });
const clockShort = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
const narrow = window.matchMedia('(max-width:600px)');
const tick = () => { $('clock').textContent = (narrow.matches ? clockShort : clockFmt).format(new Date(nowMs())); }; // a phone has no room for the seconds
tick(); setInterval(tick, 1000);
applySize(); render(); fit(); // the first fit comes after the cards, because on a phone they set how tall the map is
poll(); setInterval(poll, 10000);
setInterval(() => { if (Date.now() - dataAt > 14000) render(); }, 15000); // keep the countdowns moving if the live service is quiet
</script>
