<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#0d1526"/>
<title>Transit Lobby Display</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0f1e;color:#fff;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;background:#0d1526;padding:10px 20px;border-bottom:2px solid #1e3a6e;flex-shrink:0;z-index:1000}
header h1{font-size:1.4rem;letter-spacing:1px;color:#7ec8f5}
#clock{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.main{display:flex;flex:1;overflow:hidden}
#map{flex:1;min-width:0}
.sidebar{width:310px;flex-shrink:0;background:#0d1526;border-left:2px solid #1e3a6e;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:10px;z-index:1000}
.sidebar-title{font-size:.7rem;letter-spacing:3px;text-transform:uppercase;color:#5a8aaa;text-align:center;padding-bottom:8px;border-bottom:1px solid #1e3a6e}
.route-card{background:#111c35;border-radius:10px;overflow:hidden;border:1px solid #1e3a6e}
.route-header{display:flex;align-items:center;gap:10px;padding:9px 12px}
.route-badge{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1rem;flex-shrink:0;box-shadow:0 0 10px rgba(0,0,0,.5)}
.route-info h2{font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:215px}
.route-info .sl{font-size:.7rem;color:#7ec8f5;margin-top:2px}
.stop-sec{border-top:1px solid #1e3a6e;padding:8px 12px 10px}
.stop-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:2px;color:#5a8aaa;margin-bottom:4px}
.next-sn{font-size:.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eta-row{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.eta-num{font-size:1.8rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.eta-lbl{font-size:.75rem;color:#7ec8f5}
.en{color:#ff4d4d}.es{color:#f7c224}.eo{color:#5fb406}.ef{color:#2e9afe}
.pb-w{margin-top:6px;background:#1e3a6e;border-radius:4px;height:5px;overflow:hidden}
.pb-f{height:100%;border-radius:4px;transition:width 1s linear}
.no-bus{font-size:.8rem;color:#5a8aaa;font-style:italic;padding:4px 0 2px}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-track{background:#0a0f1e}
.sidebar::-webkit-scrollbar-thumb{background:#1e3a6e;border-radius:2px}
.ticker{background:#060c1a;border-top:1px solid #1e3a6e;overflow:hidden;white-space:nowrap;flex-shrink:0;height:26px;line-height:26px;font-size:.72rem;color:#5a8aaa;position:relative;z-index:1000}
.ticker-i{display:inline-block;animation:tk 90s linear infinite;padding-left:100%}
@keyframes tk{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.leaflet-popup-content-wrapper{background:#111c35;color:#fff;border:1px solid #1e3a6e;border-radius:8px}
.leaflet-popup-tip{background:#111c35}
/* ---------- responsive ---------- */
/* Screens wider than 1080p (a 4K lobby TV) keep the same proportions instead of shrinking. */
html{font-size:clamp(16px,.8333vw,36px)}
body{height:100dvh}
header{gap:12px;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
header>div:first-child{min-width:0}
header>div:last-child{flex-shrink:0}
header h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{white-space:nowrap}
.sidebar{width:19.375rem}
#cards{display:grid;gap:10px}
.route-info{min-width:0;flex:1}
.route-info h2{max-width:none}
.route-badge{width:2.25rem;height:2.25rem}
.ticker{box-sizing:content-box;padding-bottom:env(safe-area-inset-bottom)}
/* The City logo sits on a white disc so it reads on the dark header. Its height follows the title and clock. */
.brand{display:flex;align-items:center;gap:.75rem}
.logo{height:2.75rem;width:2.75rem;flex-shrink:0;border-radius:50%;background:#fff;padding:.14rem;display:block}

/* Short wide screens (a laptop): tighten the cards so all five routes show without scrolling. */
@media (min-width:901px) and (max-height:860px) and (min-height:521px){
  .sidebar{gap:8px}
  #cards{gap:8px}
  .route-header{padding:6px 12px}
  .route-badge{width:2rem;height:2rem}
  .stop-sec{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:6px 12px 8px}
  .stop-lbl{grid-column:1;grid-row:1;margin-bottom:2px}
  .next-sn,.no-bus{grid-column:1;grid-row:2}
  .eta-row{grid-column:2;grid-row:1/3;flex-direction:column;align-items:center;gap:1px;margin:0;min-width:3.4rem}
  .eta-num{font-size:1.5rem}
  .eta-lbl{font-size:.62rem}
  .pb-w{grid-column:1/-1;grid-row:3}
}
/* Phones and small tablets: each route becomes one compact row. */
@media (max-width:900px),(max-height:520px){
  header{padding-top:6px;padding-bottom:6px}
  header h1{font-size:1.05rem;letter-spacing:1px}
  #clock{font-size:1.2rem}
  .brand{gap:.55rem}
  .logo{height:2.2rem;width:2.2rem;padding:.11rem}
  .sidebar{padding:8px;gap:8px;padding-right:max(8px,env(safe-area-inset-right))}
  .sidebar-title{display:none}
  #cards{gap:6px}
  .route-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:7px 10px}
  .route-header,.stop-sec{display:contents}
  .route-badge{grid-column:1;grid-row:1/3;width:2.1rem;height:2.1rem}
  .route-info{grid-column:2;grid-row:1}
  .route-info h2{font-size:.72rem;font-weight:600;color:#9fb6d6}
  .route-info .sl,.stop-lbl{display:none}
  .next-sn,.no-bus{grid-column:2;grid-row:2}
  .no-bus{padding:0}
  .eta-row{grid-column:3;grid-row:1/3;flex-direction:column;align-items:center;gap:1px;margin:0;min-width:3.4rem}
  .eta-num{font-size:1.5rem}
  .eta-lbl{font-size:.62rem}
  .pb-w{grid-column:1/-1;grid-row:3;height:4px}
}
/* Upright phones and tablets: the map on top, the routes underneath. */
@media (max-width:900px) and (orientation:portrait),(max-width:600px){
  .main{flex-direction:column}
  #map{flex:1 1 auto;min-height:42dvh}
  .sidebar{width:auto;flex:0 1 auto;max-height:50dvh;border-left:0;border-top:2px solid #1e3a6e;padding-left:max(8px,env(safe-area-inset-left))}
  #cards{grid-template-columns:repeat(auto-fit,minmax(16rem,1fr))}
}
/* A phone on its side: keep the two columns, with a narrower list. */
@media (max-height:520px) and (min-width:601px){
  .sidebar{width:min(17rem,42vw)}
}
@media (prefers-reduced-motion:reduce){
  .ticker-i{animation:none;padding-left:10px}
  .pb-f{transition:none}
}
</style>
</head>

  '1':{n:1,short:'Kirkman/University',t:'#fff'},
  '2':{n:2,short:'Simmons & Prater',t:'#fff'},
  '3':{n:3,short:'Mill Street',t:'#000'},
  '4':{n:4,short:'Oak Park',t:'#fff'},
  '5':{n:5,short:'Nelson Road',t:'#fff'}
};
function nowCentral(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Chicago'}));}
const clockEl=document.getElementById('clock');
setInterval(()=>{clockEl.textContent=nowCentral().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});},1000);
clockEl.textContent=nowCentral().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const smallScreen=()=>window.matchMedia('(max-width:900px),(max-height:520px)').matches;
// Small screens may sit between zoom levels so the whole route network fits; big screens keep whole levels, which look sharpest.
const map=L.map('map',{zoomControl:true,zoomSnap:smallScreen()?.25:1}).setView([30.22392,-93.21792],13);
const routeBounds=L.latLngBounds([]);
let fittedSize=null;
function fitRoutes(){
  map.options.zoomSnap=smallScreen()?.25:1;
  map.invalidateSize();
  if(routeBounds.isValid())map.fitBounds(routeBounds,{padding:[14,14]});
  fittedSize=map.getSize();
}
// Re-centre when the screen changes shape (a phone turned on its side), but not for small shifts such as a browser toolbar hiding.
let fitTimer=null;
function mapResized(){
  clearTimeout(fitTimer);
  fitTimer=setTimeout(()=>{
    map.invalidateSize();
    const now=map.getSize();
    if(!fittedSize||Math.abs(now.x-fittedSize.x)>100||Math.abs(now.y-fittedSize.y)>100)fitRoutes();
  },250);
}
if('ResizeObserver' in window)new ResizeObserver(mapResized).observe(document.getElementById('map'));
else window.addEventListener('resize',mapResized);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);
const busMarkers={};
function drawRoutes(){
  const shapeToRoute={};
  Object.entries(TRANSIT.routeInfo).forEach(([rn,ri])=>{shapeToRoute[ri.shapeNumber]=rn;});
  Object.entries(TRANSIT.compactShapes).forEach(([sn,coords])=>{
    const rn=shapeToRoute[+sn];
    if(!rn||!TRANSIT.routeInfo[rn])return;
    const valid=coords.filter(([a,b])=>!isNaN(a)&&!isNaN(b));
    if(valid.length<2)return;
    routeBounds.extend(L.polyline(valid,{color:TRANSIT.routeInfo[rn].colour,weight:5,opacity:.85}).addTo(map).getBounds());
  });
}
function drawStops(){
  Object.entries(TRANSIT.stopMap).forEach(([sn,[name,lat,lon]])=>{
    if(!lat||!lon)return;
    L.circleMarker([lat,lon],{radius:smallScreen()?3:4,color:'#fff',weight:1,fillColor:'#1e3a6e',fillOpacity:.9}).bindTooltip(name,{direction:'top'}).addTo(map);
  });
}
function busIcon(c,t,n){
  const s='<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="17" fill="'+c+'" stroke="#fff" stroke-width="2"/><text x="18" y="23" text-anchor="middle" font-size="14" font-weight="900" font-family="Arial,sans-serif" fill="'+t+'">'+n+'</text></svg>';
  return L.divIcon({html:s,className:'',iconSize:[36,36],iconAnchor:[18,18],popupAnchor:[0,-20]});
}
function parseTime(hms){
  const [h,m,s]=hms.split(':').map(Number);
  const d=nowCentral();
  d.setHours(h,m,s||0,0);
  return d;
}
function getRouteStatus(rn){
  const trips=TRANSIT.routeTrips[String(rn)];
  if(!trips||!trips.length)return{status:'No service',stopName:null,lat:null,lon:null,etaMin:null,prog:0};
  const now=nowCentral();
  for(const trip of trips){
    if(!trip.length)continue;
    const first=parseTime(trip[0][1]);
    const last=parseTime(trip[trip.length-1][1]);
    if(now>=first&&now<=last){
      let next=null;
      for(const[sn,t]of trip){const st=parseTime(t);if(st>now){next={sn,stopTime:st};break;}}
      if(!next)next={sn:trip[trip.length-1][0],stopTime:last};
      const info=TRANSIT.stopMap[next.sn];
      const etaMin=Math.max(0,Math.round((next.stopTime-now)/60000));
      const prog=Math.min(100,Math.max(0,Math.round((now-first)/(last-first)*100)));
      return{status:'On route',stopName:info?info[0]:'Stop #'+next.sn,lat:info?info[1]:null,lon:info?info[2]:null,etaMin,prog};
    }
    if(now<first){
      return{status:'Next: '+first.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),stopName:null,lat:null,lon:null,etaMin:null,prog:0};
    }
  }
  return{status:'Last trip done',stopName:null,lat:null,lon:null,etaMin:null,prog:0};
}
function etaC(m){return m<=1?'en':m<=5?'es':m<=15?'eo':'ef';}
function renderCards(){
  const cards=document.getElementById('cards');
  cards.innerHTML='';
  const ticks=[];
  ['1','2','3','4','5'].forEach(rn=>{
    const rd=ROUTE_DISPLAY[rn];
    const ri=TRANSIT.routeInfo[rn];
    const colour=ri?ri.colour:'#888';
    const s=getRouteStatus(rn);
    const ec=s.etaMin!==null?etaC(s.etaMin):'ef';
    const en=s.etaMin!==null?(s.etaMin===0?'&#9733;':s.etaMin):'&mdash;';
    const bar=s.stopName?'<div class="pb-w"><div class="pb-f" style="width:'+s.prog+'%;background:'+colour+'"></div></div>':'';
    const div=document.createElement('div');
    div.className='route-card';
    div.innerHTML='<div class="route-header"><div class="route-badge" style="background:'+colour+';color:'+rd.t+'">'+rd.n+'</div><div class="route-info"><h2>'+(ri?ri.name:'Route '+rn)+'</h2><div class="sl">'+s.status+'</div></div></div><div class="stop-sec"><div class="stop-lbl">Next Stop</div>'+(s.stopName?'<div class="next-sn">'+s.stopName+'</div><div class="eta-row"><span class="eta-num '+ec+'">'+en+'</span><span class="eta-lbl">'+(s.etaMin===0?'Arriving':'min away')+'</span></div>'+bar:'<div class="no-bus">'+s.status+'</div>')+'</div>';
    cards.appendChild(div);
    if(s.lat&&s.lon){
      const icon=busIcon(colour,rd.t,rd.n);
      if(busMarkers[rn]){busMarkers[rn].setLatLng([s.lat,s.lon]).setIcon(icon);}
      else{busMarkers[rn]=L.marker([s.lat,s.lon],{icon}).bindPopup('<b>Route '+rd.n+'</b><br>'+(s.stopName||'')).addTo(map);}
    } else if(busMarkers[rn]){map.removeLayer(busMarkers[rn]);delete busMarkers[rn];}
    ticks.push('Route '+rd.n+': '+(s.stopName||'No active trip')+' - '+(s.etaMin!==null?s.etaMin+' min':'TBD'));
  });
  document.getElementById('ticker').textContent=ticks.join(' · ');
}
drawRoutes();
drawStops();
renderCards();
fitRoutes(); // after the cards, because on a phone they set how tall the map is
setInterval(()=>renderCards(),30000);
</script>
