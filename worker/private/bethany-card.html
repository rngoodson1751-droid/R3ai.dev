<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#05070d">
<title>Special Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --gold: #c9a54a; --gold2: #e8c869; --ink: #15130f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05070d; color: #e9e4d8; font-family: 'Jost', system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  body { background: radial-gradient(ellipse at 50% 30%, #15203a 0%, #070a14 55%, #03040a 100%); }

  /* stars */
  .stars { position: fixed; inset: 0; pointer-events: none; }
  .stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: .6; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .15; } }

  /* the jet */
  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .jet { position: absolute; top: 18%; left: 0; width: min(320px, 62vw); transform: translateX(-120%); filter: drop-shadow(0 18px 24px rgba(0,0,0,.6)); }
  .jet svg { width: 100%; height: auto; display: block; }
  .burn { transform-origin: 100% 50%; animation: flicker .08s linear infinite alternate; }
  @keyframes flicker { from { transform: scaleX(.85); opacity: .85; } to { transform: scaleX(1.15); opacity: 1; } }
  .go .jet { animation: flyby 4.6s cubic-bezier(.45,.05,.3,1) forwards; }
  @keyframes flyby {
    0%   { transform: translate(-120%, 30px) rotate(4deg); }
    38%  { transform: translate(calc(50vw - 50%), 0) rotate(-2deg); }
    62%  { transform: translate(calc(50vw - 50%), -6px) rotate(0deg); }
    100% { transform: translate(calc(100vw + 30%), -120px) rotate(-14deg); }
  }

  /* the trailing banner */
  .banner { position: absolute; top: calc(18% + min(118px, 24vw)); left: 0; transform: translateX(-160%); white-space: nowrap; display: flex; align-items: center; }
  .banner .rope { width: 46px; height: 2px; background: repeating-linear-gradient(90deg, #9aa3b8 0 6px, transparent 6px 10px); }
  .banner .flag { font-family: 'Jost', sans-serif; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: clamp(15px, 4.4vw, 26px); color: #0b0f1a; background: linear-gradient(180deg, #f6cf3c, #e0ae16); padding: 8px 16px 8px 18px; border-radius: 4px; box-shadow: 0 10px 24px rgba(0,0,0,.45); animation: wave 1.1s ease-in-out infinite; transform-origin: 0 50%; }
  @keyframes wave { 50% { transform: skewY(-2.5deg) scaleY(.96); } }
  .go .banner { animation: tow 4.6s cubic-bezier(.45,.05,.3,1) forwards; }
  @keyframes tow {
    0%   { transform: translate(-130%, 30px); }
    40%  { transform: translate(calc(50vw - 50%), 4px); }
    64%  { transform: translate(calc(50vw - 50%), -4px); }
    100% { transform: translate(calc(100vw + 40%), -120px); }
  }

  /* sonic boom ring */
  .boom { position: absolute; top: 24%; left: 50%; width: 40px; height: 40px; margin: -20px; border-radius: 50%; border: 2px solid rgba(232,200,105,.7); opacity: 0; }
  .go .boom { animation: boom 1.2s ease-out 1.7s forwards; }
  @keyframes boom { 0% { opacity: .9; transform: scale(.2); } 100% { opacity: 0; transform: scale(14); } }

  /* the card */
  .scene { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(12px, 4vh, 28px); padding: 24px 16px; z-index: 4; }
  .drop { container-type: inline-size; width: min(560px, 92vw, 105vh); aspect-ratio: 1.75 / 1; perspective: 1600px; opacity: 0; transform: translateY(-60vh) rotate(-30deg) scale(.3); }
  .go .drop { animation: fall 1.7s cubic-bezier(.2,.9,.25,1.15) 2.05s forwards; }
  @keyframes fall {
    0%   { opacity: 1; transform: translateY(-48vh) rotate(-28deg) scale(.25); }
    55%  { transform: translateY(14px) rotate(6deg) scale(1.02); }
    75%  { transform: translateY(-6px) rotate(-2deg) scale(1); }
    100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
  }
  .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.2,.8,.2,1); cursor: pointer; border: 0; padding: 0; background: none; font: inherit; color: inherit; touch-action: none; }
  .card.live { transition: transform .12s ease-out; }
  .face { position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
  .front { background: linear-gradient(145deg, #f4efe2 0%, #ece5d3 55%, #e3dac4 100%); color: var(--ink); box-shadow: 0 40px 70px -28px rgba(0,0,0,.8), 0 0 0 1px rgba(201,165,74,.55), inset 0 0 0 8px #f1ebdc, inset 0 0 0 9px rgba(176,140,60,.45); }
  .grain { position: absolute; inset: 0; opacity: .4; background-image: repeating-linear-gradient(90deg, rgba(120,100,60,.05) 0 1px, transparent 1px 3px), repeating-linear-gradient(0deg, rgba(120,100,60,.04) 0 1px, transparent 1px 4px); }
  .sheen { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.6) 48%, transparent 60%); background-size: 220% 100%; mix-blend-mode: soft-light; animation: sheen 5.5s ease-in-out infinite; }
  @keyframes sheen { 0% { background-position: -160% 0; } 60%, 100% { background-position: 260% 0; } }
  .glare { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at var(--gx, 50%) var(--gy, 30%), rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 45%); }
  .content { position: absolute; inset: 0; padding: 7% 8%; display: flex; flex-direction: column; justify-content: space-between; }
  .top, .bot { display: flex; justify-content: space-between; gap: 12px; font-family: 'Cormorant SC', serif; letter-spacing: .18em; color: #3b3427; font-size: 2.5cqw; }
  .bot { align-items: flex-end; letter-spacing: .14em; }
  .bot div { display: flex; flex-direction: column; gap: 2px; }
  .mid { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .name { font-family: 'Cormorant SC', serif; font-weight: 500; font-size: 8.6cqw; letter-spacing: .13em; color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,.9), 0 -1px 0 rgba(0,0,0,.18); }
  .rule { width: 26%; height: 1px; background: linear-gradient(90deg, transparent, #b08c3c, transparent); }
  .title { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 3.8cqw; color: #3b3427; }
  .mail { font-family: 'Cormorant Garamond', serif; letter-spacing: .04em; font-size: 2.9cqw; text-transform: none; }
  .back { transform: rotateY(180deg); background: linear-gradient(150deg, #142447 0%, #0d1a36 60%, #091228 100%); box-shadow: 0 40px 70px -28px rgba(0,0,0,.8), 0 0 0 1px rgba(232,200,105,.6); }
  .stripe { position: absolute; left: -10%; right: -10%; top: 78%; height: 5%; background: #f2c230; transform: rotate(-7deg); }
  .stripe.thin { top: calc(78% + 8%); height: 1.6%; opacity: .85; }
  .backin { position: absolute; inset: 0 0 18% 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  .backin svg { width: 18%; height: auto; }
  .lct { font-family: 'Cormorant SC', serif; font-size: 5.4cqw; letter-spacing: .3em; color: #f1e6c6; }
  .motto { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 3cqw; color: #c9b88a; }

  .after { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 2vh, 14px); opacity: 0; }
  .go .after { animation: fadein .8s ease 3.9s forwards; }
  @keyframes fadein { to { opacity: 1; } }
  .verdict { font-family: 'Cormorant SC', serif; font-size: clamp(13px, 3.6vw, 17px); letter-spacing: .3em; color: var(--gold); text-align: center; }
  .hint { font-size: 13px; letter-spacing: .1em; color: #9aa3b8; }
  .again { font: 600 14px/1 'Jost', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #0b0f1a; background: linear-gradient(180deg, var(--gold2), var(--gold)); border: 0; border-radius: 999px; padding: 14px 22px; min-height: 44px; cursor: pointer; box-shadow: 0 8px 22px rgba(201,165,74,.3); }

  @media (prefers-reduced-motion: reduce) {
    .go .jet, .go .banner, .go .boom { animation: none; display: none; }
    .drop { opacity: 1; transform: none; }
    .go .drop { animation: none; }
    .after { opacity: 1; }
    .go .after { animation: none; }
    .sheen, .stars i, .burn, .banner .flag { animation: none; }
  }
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>

<div id="show" class="go">
  <div class="sky" aria-hidden="true">
    <div class="boom"></div>
    <div class="banner"><span class="flag">Bald John ain't on par</span></div>
    <div class="jet">
      <svg viewBox="0 0 320 110" fill="none">
        <defs>
          <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5468"/><stop offset=".5" stop-color="#2a3142"/><stop offset="1" stop-color="#151a25"/></linearGradient>
          <linearGradient id="fire" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#fff6c8"/><stop offset=".35" stop-color="#ffb52e"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/></linearGradient>
          <linearGradient id="canopy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8c869"/><stop offset="1" stop-color="#6b5420"/></linearGradient>
        </defs>
        <g class="burn"><path d="M10 52 L78 46 L78 62 L10 58 Z" fill="url(#fire)"/></g>
        <path d="M78 44 L120 30 L170 26 L220 24 L282 48 L304 55 L282 60 L220 70 L170 74 L120 74 L78 64 Z" fill="url(#hull)"/>
        <path d="M128 30 L176 6 L196 6 L188 28 Z" fill="#232a39"/>
        <path d="M128 72 L184 104 L204 104 L190 74 Z" fill="#1b2130"/>
        <path d="M86 44 L96 18 L108 18 L106 38 Z" fill="#2c3446"/>
        <path d="M86 64 L98 88 L110 88 L106 68 Z" fill="#20273a"/>
        <path d="M224 40 C238 36 256 40 268 48 C254 50 236 50 224 48 Z" fill="url(#canopy)" opacity=".9"/>
        <path d="M120 52 L282 52" stroke="#5c6780" stroke-width="1" opacity=".5"/>
        <path d="M150 62 L200 60" stroke="#f2c230" stroke-width="2" opacity=".6"/>
      </svg>
    </div>
  </div>

  <main class="scene">
    <div class="drop">
      <button class="card" id="card" type="button" aria-label="Business card for Bethany Doty. Tap to flip.">
        <div class="face front">
          <div class="grain"></div><div class="sheen"></div><div class="glare"></div>
          <div class="content">
            <div class="top"><span>Lake Charles Transit</span><span>Public Works</span></div>
            <div class="mid">
              <div class="name">Bethany Doty</div>
              <div class="rule"></div>
              <div class="title">Assistant Transit Manager</div>
            </div>
            <div class="bot">
              <div><span>Department of Public Works</span><span>Transit Division</span></div>
              <span class="mail">bethany.doty@cityoflc.us</span>
            </div>
          </div>
        </div>
        <div class="face back">
          <div class="stripe"></div><div class="stripe thin"></div>
          <div class="backin">
            <svg viewBox="0 0 74 74" fill="none" stroke="#e8c869" stroke-width="1.4" aria-hidden="true">
              <circle cx="37" cy="37" r="34"/><circle cx="37" cy="37" r="28" stroke-dasharray="2 3"/>
              <rect x="20" y="22" width="34" height="26" rx="5"/><line x1="20" y1="36" x2="54" y2="36"/>
              <circle cx="27" cy="52" r="3"/><circle cx="47" cy="52" r="3"/>
            </svg>
            <div class="lct">LCT</div>
            <div class="motto">Moving Lake Charles forward</div>
          </div>
        </div>
      </button>
    </div>
    <div class="after">
      <div class="verdict">Bone stock. Raised lettering. Delivered by air.</div>
      <div class="hint">Drag to tilt. Tap to flip.</div>
      <button class="again" id="again" type="button">Send the jet again</button>
    </div>
  </main>
</div>

<script>
(function () {
  var stars = document.getElementById('stars');
  for (var i = 0; i < 90; i++) {
    var s = document.createElement('i');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
    if (Math.random() > .85) { s.style.width = s.style.height = '3px'; }
    stars.appendChild(s);
  }

  var card = document.getElementById('card'), show = document.getElementById('show');
  var flipped = false, rx = 0, ry = 0, moved = false, startX = 0, startY = 0;
  function paint() { card.style.transform = 'rotateX(' + rx + 'deg) rotateY(' + ((flipped ? 180 : 0) + ry) + 'deg)'; }
  function tilt(e) {
    var r = card.getBoundingClientRect();
    var x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    var y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    ry = (x - .5) * 32 * (flipped ? -1 : 1); rx = (.5 - y) * 24;
    card.style.setProperty('--gx', Math.round(x * 100) + '%');
    card.style.setProperty('--gy', Math.round(y * 100) + '%');
    paint();
  }
  card.addEventListener('pointerdown', function (e) { startX = e.clientX; startY = e.clientY; moved = false; card.classList.add('live'); try { card.setPointerCapture(e.pointerId); } catch (_) {} });
  card.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'mouse' || e.buttons) {
      if (Math.abs(e.clientX - startX) + Math.abs(e.clientY - startY) > 8) moved = true;
      card.classList.add('live'); tilt(e);
    }
  });
  function settle() { card.classList.remove('live'); rx = 0; ry = 0; paint(); }
  card.addEventListener('pointerleave', settle);
  card.addEventListener('pointercancel', settle);
  card.addEventListener('pointerup', function (e) { if (e.pointerType !== 'mouse') settle(); });
  card.addEventListener('click', function () { if (moved) { moved = false; return; } flipped = !flipped; settle(); });

  document.getElementById('again').addEventListener('click', function () {
    flipped = false; settle();
    show.classList.remove('go'); void show.offsetWidth; show.classList.add('go');
  });
})();
</script>
</body>
</html>
