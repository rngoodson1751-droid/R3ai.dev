<style>
/* River's fire escape plan. One page, no libraries. The drawing is the SVG below;
   the script at the bottom moves River through it. Without JavaScript the full plan still shows. */
@font-face { font-family: 'Patrick Hand'; src: url('patrick-hand.woff2') format('woff2'); font-display: swap; }
:root { --paper: #fbf6ea; --ink: #23303a; --blue: #1f5fbf; --green: #17964a; --red: #dc2a2a; --purple: #7a3fc4; color-scheme: light; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; height: 100dvh; background: var(--paper); color: var(--ink); font: 18px/1.3 'Patrick Hand', 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', cursive; }
svg#plan { flex: 1 1 auto; min-height: 0; width: 100%; display: block; }
svg text { font-family: inherit; }
.lbl { font-size: 27px; fill: #1d3f8f; text-anchor: middle; }
.step { font-size: 28px; }
.tag { font-size: 25px; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 7px; stroke-linejoin: round; fill: #b3201c; }
.dyn { opacity: 0; }
.arrow { transition: opacity .35s; }
.anim .arrow { opacity: .22; }
.anim .arrow.on { opacity: 1; }
.anim .panel { opacity: .45; transition: opacity .4s; }
.anim .panel.on { opacity: 1; }
.panel .glow { opacity: 0; transition: opacity .4s; }
.anim .panel.on .glow { opacity: .16; }

.bar { flex: none; display: none; gap: .35rem; padding: .5rem .7rem calc(.55rem + env(safe-area-inset-bottom)); border-top: 2px dashed #c9bfa6; background: #fffdf6; }
.js .bar { display: grid; }
.cap { min-height: 3.9em; display: grid; align-content: center; gap: .1rem; text-align: center; }
.cap b { font-weight: 400; font-size: 1.2rem; color: #14306e; text-wrap: balance; }
.cap span { font: .82rem/1.3 system-ui, sans-serif; color: #5a6670; text-wrap: balance; }
.row { display: flex; flex-wrap: wrap; gap: .35rem; justify-content: center; align-items: center; }
button { font: inherit; font-size: 1rem; color: #14306e; background: #e7f1fb; border: 2px solid #1f5fbf; border-radius: 999px; padding: .12rem .75rem; min-height: 2.3rem; cursor: pointer; }
button:hover { background: #d5e7fa; }
button[aria-pressed="true"], button.cur { background: #17964a; border-color: #0f6b34; color: #fff; }
button:focus-visible, input:focus-visible { outline: 3px solid #f2a900; outline-offset: 2px; }
input[type=range] { width: 100%; accent-color: #17964a; margin: 0; }
noscript p { margin: 0; padding: .5rem .8rem; text-align: center; background: #fffdf6; border-top: 2px dashed #c9bfa6; }
</style>
</head>

<div class="bar">
  <div class="cap" aria-live="polite"><b id="fr" lang="fr"></b><span id="en" lang="en"></span></div>

    <button class="jump" type="button" data-t="18" aria-label="Étape 3">3</button>
    <button class="jump" type="button" data-t="27" aria-label="Étape 4">4</button>
    <button class="jump" type="button" data-t="42">Plan B</button>

  </div>
</div>

<script>
(() => {
  document.documentElement.classList.add('js');
  const $ = id => document.getElementById(id);
  const svg = $('plan');
  svg.classList.add('anim');
  const END = 58;

  // The story. t is when each part starts, in seconds; step lights one of the four boxes.
  const SCENES = [
    { t: 0, step: 0, fr: "C'est la nuit. River dort.", en: 'It is night. River is asleep.' },
    { t: 4.5, step: 1, fr: 'Le feu ! Le détecteur de fumée sonne. Si tu vois du feu ou de la fumée, sors tout de suite !', en: 'Fire! The smoke detector goes off. If you see fire or smoke, get out right away!' },
    { t: 11, step: 2, fr: 'River reste au ras du sol, sous la fumée.', en: 'River stays low to the floor, under the smoke.' },
    { t: 18, step: 3, fr: 'Il suit les flèches pour sortir par le garage.', en: 'He follows the arrows and goes out through the garage.' },
    { t: 27, step: 4, fr: 'Il retrouve sa famille au point de rassemblement : la boîte aux lettres noire dans la cour avant !', en: 'He meets his family at the meeting place: the black mailbox in the front yard!' },
    { t: 34, step: 4, fr: 'Dehors, on appelle le 911. Le camion de pompiers arrive ! On ne retourne jamais à l\'intérieur.', en: 'Once outside, we call 911. The fire truck arrives! We never go back inside.' },
    { t: 42, step: 3, fr: 'Plan B : si la fumée bloque le couloir, River sort par la fenêtre.', en: 'Plan B: if smoke blocks the hallway, River goes out the window.' },
    { t: 52, step: 0, fr: 'Bravo, River ! Sortez. Restez dehors. Retrouvez-vous !', en: 'Well done, River! Get out. Stay out. Meet up!' },
  ];

  // ---- small helpers ----
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const span = (T, a, b) => clamp((T - a) / (b - a));           // 0 before a, 1 after b
  const ease = u => u * u * (3 - 2 * u);
  const show = (el, o) => { el.style.opacity = o; };
  function quad(p0, c, p1, n = 14) { const out = []; for (let i = 0; i <= n; i++) { const u = i / n, v = 1 - u; out.push([v * v * p0[0] + 2 * v * u * c[0] + u * u * p1[0], v * v * p0[1] + 2 * v * u * c[1] + u * u * p1[1]]); } return out; }
  function along(pts, u) {                                       // point a fraction u of the way along a line of points
    let total = 0; const seg = [];
    for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); total += d; }
    let want = clamp(u) * total;
    for (let i = 0; i < seg.length; i++) { if (want <= seg[i] || i === seg.length - 1) { const k = seg[i] ? want / seg[i] : 0; return { x: pts[i][0] + (pts[i + 1][0] - pts[i][0]) * k, y: pts[i][1] + (pts[i + 1][1] - pts[i][1]) * k, dx: pts[i + 1][0] - pts[i][0] }; } want -= seg[i]; }
  }

  // ---- River's routes ----
  const BED = [572, 456], MEET = [846, 1497];
  const A1 = [[604, 500], [584, 560], [508, 562], [508, 886]];              // bedroom door, then down the hall
  const A2 = [[508, 886], [508, 940]];                                      // through the door into the garage
  const A3 = [[508, 940], [450, 972], [450, 1240], [565, 1300], [565, 1340]]; // past the car and out the big door
  const A4 = [...quad([565, 1340], [612, 1490], [800, 1497]), MEET];       // the dotted line to the mailbox
  const B1 = [[604, 500], [694, 524], [758, 524]];                          // out the bedroom window
  const B2 = [[758, 524], [762, 1340], MEET];                               // around the side of the house

  function riverAt(T) {
    if (T < 6.6) return { x: BED[0], y: BED[1], pose: 'sleep' };
    if (T < 11) return { x: 604, y: 500, pose: 'stand', bang: 1 };
    if (T < 18) return { ...along(A1, ease(span(T, 11, 17.6))), pose: 'crawl', move: T < 17.6 };
    if (T < 19.4) return { ...along(A2, span(T, 18, 19.4)), pose: 'crawl', move: 1 };
    if (T < 27) return { ...along(A3, span(T, 19.4, 26.4)), pose: 'stand', move: T < 26.4 };
    if (T < 42) return { ...along(A4, ease(span(T, 27, 31.5))), pose: 'stand', move: T < 31.5, hop: T > 31.5 && T < 34 };
    if (T < 44) return { x: 604, y: 500, pose: 'stand', bang: 1, fade: span(T, 42.4, 43.2) };
    if (T < 46.4) return { ...along(B1, span(T, 44, 46.4)), pose: 'crawl', move: 1 };
    return { ...along(B2, ease(span(T, 46.4, 51.4))), pose: 'stand', move: T < 51.4, hop: T >= 52 };
  }

  // ---- smoke: soft grey puffs that start at the stove and drift to the hall ----
  const PUFFS = [[448, 630, 26, 5.2], [420, 660, 30, 5.8], [452, 700, 28, 6.4], [398, 620, 30, 6.8], [440, 752, 30, 7.2], [372, 690, 34, 7.6], [486, 770, 26, 8.2], [508, 730, 26, 8.8], [330, 640, 34, 9], [508, 800, 26, 9.4], [508, 670, 26, 9.8], [300, 720, 36, 10.2], [508, 610, 24, 10.6], [508, 850, 24, 11], [250, 660, 36, 11.5], [508, 548, 22, 12]];
  const HALL = [[508, 500, 28], [508, 590, 30], [500, 700, 32], [510, 790, 30], [548, 560, 22]];           // extra smoke for Plan B
  const smoke = $('smoke'), NS = 'http://www.w3.org/2000/svg';
  const puffs = [...PUFFS.map(p => ({ p })), ...HALL.map(p => ({ p, b: true }))].map((o, i) => { o.el = document.createElementNS(NS, 'circle'); o.el.style.opacity = 0; o.i = i; smoke.appendChild(o.el); return o; });

  const arrows = [...svg.querySelectorAll('.arrow')].map(el => ({ el, a: +el.dataset.a, b: +el.dataset.b || 99 }));
  const panels = [1, 2, 3, 4].map(n => $('p' + n));
  const river = $('river'), poses = { sleep: $('rv-sleep'), stand: $('rv-stand'), crawl: $('rv-crawl') };
  let scene = -1;

  // Everything on screen is worked out from the time alone, so the slider can jump anywhere.
  function render(T) {
    const s = SCENES.findLastIndex(x => T >= x.t);
    if (s !== scene) {
      scene = s;
      $('fr').textContent = SCENES[s].fr; $('en').textContent = SCENES[s].en;
      panels.forEach((p, i) => p.classList.toggle('on', SCENES[s].step === i + 1 || s === SCENES.length - 1 || s === 0));
      document.querySelectorAll('.jump').forEach(b => b.classList.toggle('cur', +b.dataset.t === SCENES[s].t));
      say(SCENES[s].fr);
    }
    const quiet = T < 4.5, finale = T >= 52;
    for (const a of arrows) a.el.classList.toggle('on', quiet || finale || (T >= a.a && T < 42) || (T >= a.b));

    // fire, smoke and the detector
    const burning = span(T, 4.5, 5.5);
    const f = $('fire'); show(f, burning);
    f.setAttribute('transform', `translate(450 668) scale(${(.9 + .12 * Math.sin(T * 11)) * burning} ${(1 + .16 * Math.sin(T * 13 + 1)) * burning}) translate(-450 -668)`);
    for (const o of puffs) {
      const [x, y, r, t0] = o.p;
      const on = o.b ? span(T, 42.3, 43.6) * .62 : span(T, t0, t0 + 2) * .5;
      show(o.el, on * (finale ? .7 : 1));
      o.el.setAttribute('cx', x + 7 * Math.sin(T * .9 + o.i)); o.el.setAttribute('cy', y + 5 * Math.cos(T * .7 + o.i * 2)); o.el.setAttribute('r', r * (1 + .08 * Math.sin(T * 1.3 + o.i)));
    }
    const beep = T >= 5.6 && Math.floor(T * 2.5) % 2 === 0;
    show($('rings'), beep ? 1 : 0); $('detled').setAttribute('fill', T >= 5.6 ? (beep ? '#dc2a2a' : '#7a1010') : '#17964a');
    show($('tg-feu'), span(T, 5, 5.6) * (1 - span(T, 16, 17)));
    show($('tg-fumee'), span(T, 7.6, 8.4) * (1 - span(T, 16, 17)));
    show($('tg-det'), span(T, 5.8, 6.4) * (1 - span(T, 12, 13)));
    show($('tg-bip'), T >= 5.6 && T < 18 ? (beep ? 1 : .25) : 0);
    show($('tg-fen'), span(T, 44.4, 45) * (1 - span(T, 49, 50)));

    // River
    const r = riverAt(T);
    for (const k in poses) poses[k].style.display = r.pose === k ? '' : 'none';
    const step = r.move ? Math.sin(T * 12) : 0, hop = r.hop ? -Math.abs(Math.sin(T * 6)) * 12 : 0;
    const face = r.dx < -1 ? -1 : 1, bob = r.pose === 'crawl' && r.move ? Math.sin(T * 14) * 1.5 : 0;
    river.setAttribute('transform', `translate(${r.x.toFixed(1)} ${(r.y + hop + bob).toFixed(1)})`);
    poses[r.pose].setAttribute('transform', r.pose === 'sleep' ? '' : `scale(${face * 1.05} 1.05)`);
    $('leg1').setAttribute('transform', `rotate(${step * 24} -5 -20)`); $('leg2').setAttribute('transform', `rotate(${-step * 24} 5 -20)`);
    $('arm1').setAttribute('transform', `rotate(${(r.hop ? 150 : -step * 22)} -11 -43)`); $('arm2').setAttribute('transform', `rotate(${(r.hop ? -150 : step * 22)} 11 -43)`);
    show(river, r.fade === undefined ? 1 : r.fade);
    show($('zzz'), .5 + .5 * Math.sin(T * 3));
    $('rv-name').setAttribute('y', r.pose === 'stand' ? -76 : r.pose === 'crawl' ? -44 : -22);
    show($('rv-bang'), r.bang ? 1 : 0);

    // the family, the call and the fire fighters
    show($('family'), span(T, 28.5, 30));
    $('tail').setAttribute('transform', `rotate(${Math.sin(T * 9) * 18} -25 -24)`);
    show($('tg-911'), span(T, 34.2, 35) * (1 - span(T, 41, 42)));
    const drive = ease(span(T, 35.5, 39));
    const tk = $('truck'); show(tk, T >= 35.5 ? 1 - span(T, 42, 42.8) + span(T, 52, 53) : 0);
    tk.setAttribute('transform', `translate(${-240 + drive * 660} 1632)`);
    const pm = $('pompier'); show(pm, span(T, 39.3, 40) * (1 - span(T, 42, 42.8)) + span(T, 52.5, 53.3));
    pm.setAttribute('transform', 'translate(660 1630)'); $('pwave').setAttribute('transform', `rotate(${Math.sin(T * 7) * 16} 12 -50)`);
  }

  // ---- the read-aloud voice (off until someone taps Voix) ----
  let voiceOn = false;
  function say(text) {
    if (!voiceOn || !playing || !('speechSynthesis' in window)) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'fr-FR'; u.rate = .85; const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('fr')); if (v) u.voice = v; speechSynthesis.speak(u); } catch (e) {}
  }
  if (!('speechSynthesis' in window)) $('voice').hidden = true;
  $('voice').onclick = () => { voiceOn = !voiceOn; $('voice').setAttribute('aria-pressed', voiceOn); if (voiceOn) say(SCENES[scene].fr); else try { speechSynthesis.cancel(); } catch (e) {} };

  // ---- clock and controls ----
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let T = calm ? END - .01 : 0, playing = !calm, last = 0;
  const seek = $('seek'), play = $('play');
  const label = () => { play.textContent = playing ? 'Pause' : 'Lecture'; play.setAttribute('aria-label', playing ? 'Pause' : 'Lecture / Play'); };
  function frame(now) {
    const dt = Math.min(.1, (now - last) / 1000 || 0); last = now;
    if (playing) { T += dt; if (T >= END + 3) T = 0; seek.value = Math.min(T, END); }
    render(Math.min(T, END - .01));
    requestAnimationFrame(frame);
  }
  const go = t => { T = t; scene = -1; seek.value = t; playing = true; label(); };
  play.onclick = () => { playing = !playing; if (playing && T >= END) T = 0; if (!playing) try { speechSynthesis.cancel(); } catch (e) {} label(); };
  $('again').onclick = () => go(0);
  document.querySelectorAll('.jump').forEach(b => b.onclick = () => go(+b.dataset.t));
  seek.oninput = () => { T = +seek.value; playing = false; label(); };
  document.addEventListener('visibilitychange', () => { last = 0; });
  addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') { e.preventDefault(); play.click(); } });
  label();
  requestAnimationFrame(frame);
  window.__seek = t => { T = t; playing = false; label(); render(t); };   // handy when testing: __seek(20)
})();
</script>
</body>
