<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch | R Cubed</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #player, #player iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #sound {
    position: fixed; z-index: 2;
    bottom: max(20px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    font: 600 16px/1 -apple-system, system-ui, "Inter", sans-serif; color: #fff;
    background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35);
    -webkit-backdrop-filter: blur(16px) saturate(1.6); backdrop-filter: blur(16px) saturate(1.6);
    padding: 14px 22px; border-radius: 999px; cursor: pointer; min-height: 44px;
  }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<div id="player">
  <!-- Works without JavaScript: muted autoplay straight from YouTube. -->
  <iframe src="https://www.youtube.com/embed/EEOp-FaekSY?autoplay=1&mute=1&playsinline=1&rel=0"
    title="Video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
</div>
<button id="sound" hidden>Tap for sound</button>
<script>
  // Browsers only allow autoplay with the sound off, so the video starts muted and one tap turns it on.
  var btn = document.getElementById('sound');
  window.onYouTubeIframeAPIReady = function () {
    var p = new YT.Player('player', {
      videoId: 'EEOp-FaekSY',
      playerVars: { autoplay: 1, mute: 1, playsinline: 1, rel: 0 },
      events: {
        onReady: function (e) { e.target.playVideo(); btn.hidden = false; }
      }
    });
    btn.onclick = function () { p.unMute(); p.setVolume(100); p.playVideo(); btn.hidden = true; };
  };
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
</script>
</body>
</html>
