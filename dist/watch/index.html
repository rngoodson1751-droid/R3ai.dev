<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch | R Cubed</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #player, #player iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #start {
    position: fixed; inset: 0; z-index: 2; border: 0; padding: 0; margin: 0; width: 100%;
    background: #000 url("https://i.ytimg.com/vi/EEOp-FaekSY/hqdefault.jpg") center / cover no-repeat;
    cursor: pointer; display: grid; place-items: center; -webkit-tap-highlight-color: transparent;
  }
  #start::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.45); }
  #start span {
    position: relative; display: flex; align-items: center; gap: 14px;
    font: 700 22px/1 -apple-system, system-ui, "Inter", sans-serif; color: #fff;
    background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6);
    padding: 20px 30px; border-radius: 999px;
  }
  #start svg { width: 26px; height: 26px; fill: #fff; }
  #start[hidden] { display: none; }
</style>
</head>
<body>
<div id="player">
  <!-- Without JavaScript, YouTube's own play button plays it with sound. -->
  <iframe src="https://www.youtube.com/embed/EEOp-FaekSY?playsinline=1&rel=0"
    title="Video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
</div>
<button id="start" hidden aria-label="Tap to play"><span><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>Tap to play</span></button>
<script>
  // Phones only allow sound after a tap, so the page opens on one big Tap to play.
  var start = document.getElementById('start'), p, ready = false;
  start.hidden = false;
  window.onYouTubeIframeAPIReady = function () {
    p = new YT.Player('player', {
      videoId: 'EEOp-FaekSY',
      playerVars: { playsinline: 1, rel: 0 },
      events: { onReady: function () { ready = true; } }
    });
  };
  start.onclick = function () {
    if (!ready) return;
    p.unMute(); p.setVolume(100); p.playVideo();
    start.hidden = true;
    // If the phone still refuses, YouTube's own play button is right underneath and plays with sound.
  };
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
</script>
</body>
</html>
